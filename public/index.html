<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager — Task Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/app.js"></script>
  </head>
  <body>
    <main class="shell">
      <!-- Hero Section & Overview -->
      <section class="hero card">
        <div class="top-bar">
          <div class="brand-wrap">
            <div class="brand-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
                <path d="m9 12 2 2 4-4"/>
              </svg>
            </div>
            <div class="brand-title-group">
              <span class="eyebrow">Task Workspace</span>
              <h1 class="hero-title">Task Manager</h1>
            </div>
          </div>
        </div>

        <p class="hero-description">Organize your tasks, track completion progress, and filter by priority effortlessly.</p>

        <!-- Dashboard Stats Row -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon total">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <line x1="9" y1="9" x2="15" y2="9"/>
                <line x1="9" y1="15" x2="15" y2="15"/>
              </svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">Total Tasks</span>
              <span class="stat-value" id="stat-total">0</span>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon pending">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">Pending</span>
              <span class="stat-value" id="stat-pending">0</span>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon completed">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
              </svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">Completed</span>
              <span class="stat-value" id="stat-completed">0</span>
            </div>
          </div>

          <div class="stat-card progress-card">
            <div class="stat-info">
              <div class="progress-header">
                <span class="stat-label">Progress</span>
                <span class="progress-percent" id="stat-percent">0%</span>
              </div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="grid">
        <!-- Task Form Panel -->
        <form class="card panel form-panel" id="task-form">
          <div class="panel-head">
            <div class="head-title">
              <div class="icon-wrap" id="form-icon-wrap">
                <svg id="form-header-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <line x1="12" y1="8" x2="12" y2="16"/>
                  <line x1="8" y1="12" x2="16" y2="12"/>
                </svg>
              </div>
              <h2 id="form-title">Create Task</h2>
            </div>
            <button type="button" class="ghost cancel-btn" id="cancel-edit" hidden aria-label="Cancel editing">
              Cancel Edit
            </button>
          </div>

          <label class="form-group">
            <span>Title</span>
            <div class="input-wrapper">
              <input id="task-title" type="text" placeholder="e.g. Build API documentation" required autocomplete="off" />
            </div>
          </label>

          <label class="form-group">
            <span>Description</span>
            <div class="input-wrapper">
              <textarea id="task-description" rows="3" placeholder="Add optional context or notes..."></textarea>
            </div>
          </label>

          <div class="form-row">
            <label class="form-group">
              <span>Priority</span>
              <div class="select-wrapper">
                <select id="task-priority">
                  <option value="medium" selected>Medium</option>
                  <option value="high">High</option>
                  <option value="low">Low</option>
                </select>
              </div>
            </label>

            <label class="form-group">
              <span>Category</span>
              <div class="select-wrapper">
                <select id="task-category">
                  <option value="Work" selected>Work</option>
                  <option value="Personal">Personal</option>
                  <option value="Feature">Feature</option>
                  <option value="Bug">Bug</option>
                  <option value="Urgent">Urgent</option>
                </select>
              </div>
            </label>
          </div>

          <label class="checkbox-container">
            <input id="task-completed" type="checkbox" />
            <span class="custom-checkbox">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </span>
            <span class="checkbox-label">Mark as completed</span>
          </label>

          <div class="message-banner" id="form-message-container">
            <p class="message" id="form-message" aria-live="polite"></p>
          </div>

          <div class="actions">
            <button type="submit" class="primary submit-btn" id="submit-button">
              <span>Add Task</span>
            </button>
          </div>
        </form>

        <!-- Tasks Display Panel -->
        <section class="card panel list-panel">
          <div class="panel-head list-head">
            <div class="head-title">
              <h2>Tasks</h2>
              <span id="task-count" class="badge-count">0 tasks</span>
            </div>
          </div>

          <!-- Controls: Search & Filter Tabs -->
          <div class="controls-bar">
            <div class="search-box">
              <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              <input type="text" id="search-input" placeholder="Search tasks..." autocomplete="off" />
              <button type="button" id="clear-search" class="clear-btn" hidden aria-label="Clear search">
                &times;
              </button>
            </div>

            <div class="filter-tabs">
              <button type="button" class="tab-btn active" data-filter="all">All</button>
              <button type="button" class="tab-btn" data-filter="pending">Pending</button>
              <button type="button" class="tab-btn" data-filter="completed">Completed</button>
            </div>
          </div>

          <div id="task-list" class="task-list"></div>
        </section>
      </section>
    </main>
  </body>
</html>
